name: Execute Approved Blocks

# Runs when a block-request PR is MERGED. Closing without merge blocks
# nobody. Pure-GitHub human gate: no backend, no extra service.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'data/review_queue.json'

permissions:
  contents: write

concurrency:
  group: sentinel-data
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Block approved logins
        env:
          GH_TOKEN: ${{ secrets.GH_BLOCKER_TOKEN }}
        run: |
          python src/audit.py --execute-approved

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/review_queue.json REVIEW_QUEUE.md data/blocklist.json BLOCKED_ACCOUNTS.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(review): execute merged block decisions" && git push)
