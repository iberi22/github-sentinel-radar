name: GitHub Radar - On-Demand Technical Feed

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar actualización saltando hibernación'
        required: false
        default: 'true'
        type: boolean
      min_stars:
        description: 'Vacío = valor de config.json. Mínimo de estrellas para descubrimientos'
        required: false
        default: ''
      max_stars:
        description: 'Vacío = valor de config.json. Máximo (excluye mega-famosos ya conocidos)'
        required: false
        default: ''
      pushed_within_days:
        description: 'Vacío = config.json. Solo proyectos activos en los últimos N días'
        required: false
        default: ''
      created_within_days:
        description: 'Vacío = config.json. Solo proyectos creados en los últimos N días'
        required: false
        default: ''
      topics:
        description: 'Vacío = config.json. Nº de top topics a explorar (1-5)'
        required: false
        default: ''
      exclude_seen:
        description: 'No repetir proyectos ya mostrados'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

concurrency:
  group: sentinel-data
  cancel-in-progress: false

jobs:
  run-radar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Radar Engine
        env:
          FORCE_RUN: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          RADAR_USERNAME: ${{ vars.RADAR_USERNAME || github.repository_owner }}
          RADAR_MIN_STARS: ${{ inputs.min_stars }}
          RADAR_MAX_STARS: ${{ inputs.max_stars }}
          RADAR_PUSHED_WITHIN_DAYS: ${{ inputs.pushed_within_days }}
          RADAR_CREATED_WITHIN_DAYS: ${{ inputs.created_within_days }}
          RADAR_TOPICS: ${{ inputs.topics }}
          RADAR_EXCLUDE_SEEN: ${{ inputs.exclude_seen }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            python src/radar.py --force
          else
            python src/radar.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/radar.json RADAR.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): update tech feed and discoveries" && git push)
